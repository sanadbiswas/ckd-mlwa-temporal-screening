name: Install exact manuscript figures

on:
  push:
    paths:
      - '.png_upload_exact/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact result figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ckd_results
          for stem in calibration_transport decision_curve_temporal internal_calibration_oof temporal_permutation_importance; do
            cat .png_upload_exact/${stem}.png.b64.* | base64 --decode > ckd_results/${stem}.png
            cat .png_upload_exact/${stem}.eps.b64.* | base64 --decode > ckd_results/${stem}.eps
          done

          rm -f ckd_results/calibration_transport.jpg \
                ckd_results/decision_curve_temporal.jpg \
                ckd_results/internal_calibration_oof.jpg \
                ckd_results/temporal_permutation_importance.jpg

          rm -rf .png_upload_exact

      - name: Verify expected files
        shell: bash
        run: |
          set -euo pipefail
          for stem in calibration_transport decision_curve_temporal internal_calibration_oof temporal_permutation_importance; do
            test -s ckd_results/${stem}.png
            test -s ckd_results/${stem}.eps
          done

      - name: Commit exact figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace JPG previews with exact PNG and EPS result figures"
          git push
