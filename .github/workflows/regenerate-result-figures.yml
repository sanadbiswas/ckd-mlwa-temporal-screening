name: Regenerate current result figures

on:
  push:
    paths:
      - '.github/workflows/regenerate-result-figures.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            matplotlib==3.10.0 \
            scikit-learn==1.6.1 \
            lightgbm==4.7.0 \
            xgboost==3.4.1 \
            imbalanced-learn==0.14.2 \
            statsmodels==0.15.0 \
            scipy requests ipython jupyter

      - name: Regenerate manuscript figures from current analysis code
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from pathlib import Path
          from sklearn.base import clone
          from pipeline_runner import CKDPipelineRunner

          root = Path.cwd().resolve()
          r = CKDPipelineRunner(root)

          r.prepare_data()
          r.setup()
          r.load_development_data()
          r.build_preprocessor()
          r.define_candidate_models()
          r.define_metrics()

          ns = r.namespace
          exact_params = {
              'model__l2_regularization': 0.005862091817736678,
              'model__learning_rate': 0.014013101442434277,
              'model__max_iter': 218,
              'model__max_leaf_nodes': 7,
              'model__min_samples_leaf': 28,
          }

          ns['SELECTED_MODEL_NAME'] = 'HistGradientBoosting'
          ns['final_raw_model'] = clone(
              ns['MODEL_SPECS']['HistGradientBoosting']['pipeline']
          ).set_params(**exact_params)
          ns['final_raw_model'].fit(ns['X_dev'], ns['y_dev'])

          r.calibrate_model()
          r.freeze_threshold()
          r.fit_final_model()
          r.build_temporal_cohort()
          r.run_temporal_validation()
          r.run_temporal_calibration()
          r.run_decision_curve()
          r.run_permutation_importance()
          PY

      - name: Keep native result formats only
        run: |
          set -euo pipefail
          rm -f ckd_results/*.jpg
          rm -rf .figure_upload .png_upload_exact

          test -s ckd_results/internal_calibration_oof.png
          test -s ckd_results/calibration_transport.png
          test -s ckd_results/decision_curve_temporal.png
          test -s ckd_results/temporal_permutation_importance.png
          test -s ckd_results/internal_calibration_oof.eps
          test -s ckd_results/calibration_transport.eps
          test -s ckd_results/decision_curve_temporal.eps
          test -s ckd_results/temporal_permutation_importance.eps

      - name: Commit native PNG and EPS figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ckd_results .figure_upload .png_upload_exact 2>/dev/null || true
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Restore native PNG and EPS manuscript figures"
            git push
          fi
